<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Facturación / Faturamento — 29/07/2026</title>
<style>
:root{
  --navy:#0B1F3A;--navy2:#13294B;--bg:#F5F7FA;--panel:#FFFFFF;
  --line:#E3E7ED;--ink:#10182A;--muted:#6B7686;
  --action:#C04A1A;   /* requer ação / manual pendente */
  --action-bg:#FDEEE8;
  --completo:#1F8A6F;  /* completo */
  --completo-bg:#E6F4EF;
  --semacao:#4A7FC1;   /* sem ação / automático */
  --semacao-bg:#EAF1FB;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px;}

/* TOPBAR */
.topbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:28px 40px 22px;}
.topbar-inner{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;}
.topbar h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-0.01em;}
.topbar .sub{font-size:12px;color:#AEC2DD;margin-top:4px;}
.topbar .meta{font-size:11px;color:#8FA6C4;text-align:right;line-height:1.8;}
.topbar .meta b{color:#fff;}

/* SITE TABS */
.site-tabs-wrap{background:var(--navy);border-top:1px solid rgba(255,255,255,.1);padding:0 40px;}
.site-tabs-inner{max-width:1400px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;}
.stab{padding:10px 20px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:#8FA6C4;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;
  display:flex;align-items:center;gap:7px;white-space:nowrap;}
.stab:hover{color:#fff;}
.stab.active{color:#fff;border-bottom-color:#E07A3A;}
.stab .scount{background:rgba(255,255,255,.15);color:#DCE6F2;font-size:10px;padding:2px 6px;border-radius:8px;font-weight:700;}
.stab.active .scount{background:#E07A3A;color:#fff;}

.wrap{max-width:1400px;margin:0 auto;padding:0 40px 60px;}

/* KPI STRIP */
.kpi-section{margin-top:24px;margin-bottom:28px;}
.kpi-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.kpi-label::after{content:'';flex:1;height:1px;background:var(--line);}
.kpis{display:grid;gap:12px;}
.kpis.cols3{grid-template-columns:repeat(3,1fr);}
.kpis.cols2{grid-template-columns:repeat(2,1fr);}
.kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:12px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;
  box-shadow:0 2px 8px rgba(16,24,42,.04);border-left:4px solid transparent;}
.kpi.action{border-left-color:var(--action);}
.kpi.completo{border-left-color:var(--completo);}
.kpi.semacao{border-left-color:var(--semacao);}
.kpi.neutral{border-left-color:var(--line);}
.kpi .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;}
.kpi .num{font-size:20px;font-weight:700;letter-spacing:-0.01em;margin-top:5px;color:var(--navy);}
.kpi.action .num{color:var(--action);}
.kpi.completo .num{color:var(--completo);}
.kpi.semacao .num{color:var(--semacao);}
.kpi .delta{font-size:11px;color:var(--muted);margin-top:2px;}

/* ALERT BANNER */
.alert-banner{
  background:var(--action-bg);border:1px solid #F0B49A;border-radius:10px;
  padding:14px 20px;margin-bottom:20px;
  display:flex;align-items:center;gap:12px;font-size:13px;
}
.alert-banner .icon{font-size:20px;flex:none;}
.alert-banner strong{color:var(--action);}
.alert-banner.hidden{display:none;}

/* TOOLBAR */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
.toolbar h2{font-size:14px;font-weight:700;margin:0;color:var(--navy);}
.filters{display:flex;gap:6px;flex-wrap:wrap;}
.fbtn{font-size:11px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted);
  padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .15s;}
.fbtn:hover{border-color:var(--navy);color:var(--navy);}
.fbtn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.fbtn.f-action.active{background:var(--action);border-color:var(--action);}
.fbtn.f-semacao.active{background:var(--semacao);border-color:var(--semacao);}

/* LEGEND */
.legend-row{display:flex;gap:16px;font-size:11px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap;}
.legend-row span{display:inline-flex;align-items:center;gap:5px;font-weight:600;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* TABLE */
.tablecard{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 2px 8px rgba(16,24,42,.04);overflow:hidden;}
.row-head{display:grid;grid-template-columns:30px 2fr 130px 130px 1fr 100px 40px;
  padding:9px 18px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  font-weight:700;border-bottom:1px solid var(--line);background:#FAFBFC;gap:6px;align-items:center;}
.row{display:grid;grid-template-columns:30px 2fr 130px 130px 1fr 100px 40px;
  padding:13px 18px;align-items:center;border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .12s;gap:6px;}
.row:last-child{border-bottom:none;}
.row:hover{background:#F4F7FB;}
.row.hidden{display:none;}
.row.has-action{border-left:3px solid var(--action);}
.rk{color:var(--muted);font-size:11px;font-weight:600;}
.owner-cell{font-weight:700;font-size:13px;}
.owner-cell .sub{font-weight:500;color:var(--muted);font-size:10.5px;margin-top:1px;}
.action-cell{text-align:right;}
.action-val{font-size:13px;font-weight:700;color:var(--action);}
.action-count{font-size:10.5px;color:var(--muted);margin-top:1px;}
.semacao-cell{text-align:right;}
.semacao-val{font-size:13px;font-weight:600;color:var(--semacao);}
.semacao-count{font-size:10.5px;color:var(--muted);margin-top:1px;}
.barwrap{padding:0 4px;}
.bar{height:8px;width:100%;display:flex;border-radius:4px;overflow:hidden;background:#EEF1F5;}
.bar .seg.action{background:var(--action);}
.bar .seg.semacao{background:var(--semacao);}
.totalcell{text-align:right;font-weight:700;font-size:13px;color:var(--navy);}
.chevron{color:#D0D5DE;font-size:14px;text-align:right;}
.row:hover .chevron{color:var(--action);}

.footnote{margin-top:16px;font-size:11px;color:var(--muted);text-align:center;}

/* STATUS/TYPE PILLS */
.pill{display:inline-block;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
.pill.pendente{background:var(--action-bg);color:#8A2E0E;}
.pill.completo{background:var(--completo-bg);color:#145C42;}
.pill.requer_acao{background:var(--action-bg);color:#8A2E0E;}
.pill.sem_acao{background:var(--semacao-bg);color:#1A3E6E;}
.pill.Manual{background:#EDE8FB;color:#4A2E9E;}
.pill.Account{background:var(--semacao-bg);color:#1A3E6E;}
.pill.Advertiser{background:#E3F2F9;color:#0E4A6B;}
.pill.Unknown{background:#F0F0F0;color:#666;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(11,31,58,.55);display:none;align-items:flex-start;
  justify-content:center;padding:44px 20px;overflow-y:auto;z-index:50;backdrop-filter:blur(2px);}
.overlay.open{display:flex;}
.modal{background:var(--panel);max-width:1000px;width:100%;border-radius:12px;
  box-shadow:0 20px 60px rgba(11,31,58,.3);overflow:hidden;animation:rise .2s ease;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;
  padding:20px 26px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;gap:16px;}
.modal-head h3{font-size:16px;margin:0;font-weight:700;}
.modal-head .mh-sub{font-size:11px;color:#AEC2DD;margin-top:3px;}
.close-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;
  width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;flex:none;}
.close-btn:hover{background:rgba(255,255,255,.25);}

/* Modal summary cards */
.modal-summary{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);}
.ms-card{padding:16px 22px;border-right:1px solid var(--line);}
.ms-card:last-child{border-right:none;}
.ms-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:8px;}
.ms-val{font-size:22px;font-weight:800;letter-spacing:-0.01em;}
.ms-val.action{color:var(--action);}
.ms-val.semacao{color:var(--semacao);}
.ms-sub{font-size:11px;color:var(--muted);margin-top:3px;}

/* Modal table tabs */
.modal-tabs{display:flex;border-bottom:1px solid var(--line);background:#FAFBFC;}
.mtab{padding:10px 20px;font-size:12px;font-weight:600;cursor:pointer;
  color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;}
.mtab.active{color:var(--action);border-bottom-color:var(--action);}
.mtab.semacao.active{color:var(--semacao);border-bottom-color:var(--semacao);}

.modal-body{max-height:50vh;overflow-y:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{text-align:left;text-transform:uppercase;letter-spacing:.04em;font-size:10px;color:var(--muted);
  padding:9px 20px 8px;border-bottom:1px solid var(--line);font-weight:700;position:sticky;top:0;background:#fff;}
tbody td{padding:9px 20px;border-bottom:1px solid #EEF1F5;vertical-align:middle;}
tbody tr:hover{background:#FAFBFC;}
.amt{font-weight:700;text-align:right;}
.modal-foot{padding:12px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);background:#FAFBFC;text-align:right;}

@media(max-width:900px){
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .row-head,.row{grid-template-columns:24px 1fr 100px 100px 40px;}
  .row .barwrap,.row .totalcell,.row-head span:nth-child(6),.row-head span:nth-child(7){display:none;}
  .wrap,.topbar,.site-tabs-wrap{padding-left:16px;padding-right:16px;}
  .modal-summary{grid-template-columns:1fr;}
  .ms-card{border-right:none;border-bottom:1px solid var(--line);}
}
</style>
</head>

const brl = v => 'R$'+v.toLocaleString('pt-BR',{maximumFractionDigits:0});
const esM = v => '$'+v.toLocaleString('es',{maximumFractionDigits:0});
const moneyFull = (v,lang) => lang==='pt'?brl(v):esM(v);
const moneyK = (v,lang) => {
  if(lang==='pt') return v>=1e6?'R$'+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+'M':'R$'+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+'K';
  return v>=1e6?'$'+(v/1e6).toLocaleString('es',{maximumFractionDigits:1})+'M':'$'+(v/1e3).toLocaleString('es',{maximumFractionDigits:0})+'K';
};

let currentSite='MLB', currentFilter='all', modalTab='action';

// Build site tabs
const tabsEl=document.getElementById('siteTabs');
SITES.forEach(site=>{
  const owners=ALL_DATA[site];
  const pending=owners.reduce((s,o)=>s+o.manual_pendente_count,0);
  const btn=document.createElement('div');
  btn.className='stab'+(site===currentSite?' active':'');
  btn.dataset.site=site;
  btn.innerHTML=`${SITE_FLAGS[site]||''} ${site} <span class="scount">${pending}</span>`;
  btn.title=`${pending} pendentes`;
  btn.addEventListener('click',()=>switchSite(site));
  tabsEl.appendChild(btn);
});

function switchSite(site){
  currentSite=site; currentFilter='all';
  document.querySelectorAll('.stab').forEach(t=>t.classList.toggle('active',t.dataset.site===site));
  renderAll();
}

const getLang=()=>currentSite==='MLB'?'pt':'es';

  const lang=getLang(), t=T[lang], data=ALL_DATA[currentSite];

  `;
  document.getElementById('filters').querySelectorAll('.fbtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      currentFilter=btn.dataset.f;
      document.querySelectorAll('#filters .fbtn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter();
    });
  });

  // Legend
  document.getElementById('legend').innerHTML=`
    <span><i class="dot" style="background:var(--action)"></i>${t.legAction}</span>
    <span><i class="dot" style="background:var(--semacao)"></i>${t.legSemAcao}</span>
  `;

  // Row header
  document.getElementById('rowHead').innerHTML=`
    <span>#</span>
    <span>${t.colOwner}</span>
    <span style="text-align:right">${t.colAction.replace('\n','<br>')}</span>
    <span style="text-align:right">${t.colSemAcao.replace('\n','<br>')}</span>
    <span>${t.colBar}</span>
    <span style="text-align:right">${t.colTotal}</span>
    <span></span>
  `;

  // Rows
  const rowsEl=document.getElementById('rows');
  rowsEl.innerHTML=data.map((o,i)=>{
    const ap=o.manual_pendente_value, sp=o.sem_acao_value;
    const tot=(ap+sp)||1;
    const apPct=ap/tot*100, spPct=sp/tot*100;
    const hasAction=o.manual_pendente_count>0;
    return `<div class="row ${hasAction?'has-action':''}"
      data-idx="${data.indexOf(o)}"
      data-hasaction="${hasAction}"
      data-hassemacao="${o.sem_acao_count>0}">
      <span class="rk">${i+1}</span>
      <div class="owner-cell">${o.owner}<div class="sub">${o.total_count} ${t.orders}</div></div>
      <div class="action-cell">
        ${hasAction
          ? `<div class="action-val">${moneyK(ap,lang)}</div><div class="action-count">${o.manual_pendente_count} ${t.orders}</div>`
          : `<div style="color:var(--line);font-size:12px">—</div>`}
      </div>
      <div class="semacao-cell">
        ${o.sem_acao_count>0
          ? `<div class="semacao-val">${moneyK(sp,lang)}</div><div class="action-count">${o.sem_acao_count} ${t.orders}</div>`
          : `<div style="color:var(--line);font-size:12px">—</div>`}
      </div>
      <div class="barwrap"><div class="bar">
        <div class="seg action" style="width:${apPct}%"></div>
        <div class="seg semacao" style="width:${spPct}%"></div>
      </div></div>
      <span class="totalcell">${moneyK(o.total_value,lang)}</span>
      <span class="chevron">›</span>
    </div>`;
  }).join('');
  rowsEl.querySelectorAll('.row').forEach(r=>{
    r.addEventListener('click',()=>openModal(data[+r.dataset.idx],lang));
  });

  document.getElementById('footnote').textContent=t.footnote;
  applyFilter();
}

function applyFilter(){
  const allRows=document.querySelectorAll('#rows .row');
  allRows.forEach(r=>{
    let show=true;
    if(currentFilter==='action') show=r.dataset.hasaction==='true';
    if(currentFilter==='semacao') show=r.dataset.hassemacao==='true';
    r.classList.toggle('hidden',!show);
  });
  let n=1;
  allRows.forEach(r=>{if(!r.classList.contains('hidden')) r.querySelector('.rk').textContent=n++;});
}

const overlay=document.getElementById('overlay');

function renderModalTable(o, lang, tab){
  const t=T[lang];
  document.getElementById('modalThead').innerHTML=`
    <th>${t.thConta}</th><th>${t.thOrder}</th><th>${t.thAdvertiser}</th>
    <th>${t.thStart}</th><th>${t.thType}</th><th>${t.thStatus}</th>
    <th style="text-align:right">${t.thValue}</th>
  `;
  const orders = tab==='action'
    ? o.orders.filter(r=>r.action_type==='requer_acao')
    : o.orders.filter(r=>r.action_type==='sem_acao');

  document.getElementById('modalBody').innerHTML=orders.map(r=>{
    const statusLabel = r.invoice_status==='pendente' ? t.statusPendente : t.statusCompleto;
    const statusClass = r.invoice_status==='pendente' ? 'pendente' : 'completo';
    const typeLabel   = r.action_type==='requer_acao'  ? t.typeAction   : t.typeSemAcao;
    const typeClass   = r.action_type==='requer_acao'  ? 'requer_acao'  : 'sem_acao';
    const btClass     = r['Billing Type'].replace(' ','-');
    return `<tr>
      <td>${r['Account Name']}</td>
      <td>${r['Order Number']}</td>
      <td>${r['Advertiser Name']}</td>
      <td>${r['Order Start Date']}</td>
      <td><span class="pill ${typeClass}">${typeLabel}</span><br><small style="color:var(--muted);font-size:10px">${r['Billing Type']}</small></td>
      <td><span class="pill ${statusClass}">${statusLabel}</span></td>
      <td class="amt">${moneyFull(r['Order Amount'],lang)}</td>
    </tr>`;
  }).join('');
  document.getElementById('modalFoot').textContent=`${t.modalFootTotal}: ${moneyFull(o.total_value,lang)} · ${o.total_count} ${t.orders}`;
}

function openModal(o, lang){
  const t=T[lang];
  modalTab=o.manual_pendente_count>0?'action':'semacao';
  document.getElementById('modalOwner').textContent=o.owner;
  document.getElementById('modalSub').textContent=`${o.total_count} ${t.orders} · ${moneyFull(o.total_value,lang)} ${t.portfolio}`;

  // Summary cards
  document.getElementById('modalSummary').innerHTML=`
    <div class="ms-card">
      <div class="ms-label">${t.msAction}</div>
      <div class="ms-val action">${moneyFull(o.manual_pendente_value,lang)}</div>
      <div class="ms-sub">${t.msActionSub(o.manual_pendente_count)}</div>
    </div>
    <div class="ms-card">
      <div class="ms-label">${t.msSemAcao}</div>
      <div class="ms-val semacao">${moneyFull(o.sem_acao_value,lang)}</div>
      <div class="ms-sub">${t.msSemAcaoSub(o.sem_acao_count)}</div>
    </div>
  `;

  // Tabs
  function renderTabs(){
    document.getElementById('modalTabs').innerHTML=`
      <div class="mtab ${modalTab==='action'?'active':''}" data-tab="action">${t.tabAction} (${o.manual_pendente_count})</div>
      <div class="mtab semacao ${modalTab==='semacao'?'active semacao':''}" data-tab="semacao">${t.tabSemAcao} (${o.sem_acao_count})</div>
    `;
    document.querySelectorAll('.mtab').forEach(tb=>{
      tb.addEventListener('click',()=>{
        modalTab=tb.dataset.tab;
        renderTabs();
        renderModalTable(o,lang,modalTab);
      });
    });
  }
  renderTabs();
  renderModalTable(o,lang,modalTab);
  overlay.classList.add('open');
}

document.getElementById('closeBtn').addEventListener('click',()=>overlay.classList.remove('open'));
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open');});

renderAll();
</script>
</body>
</html>
